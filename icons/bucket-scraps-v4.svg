  <!-- One peel flap curling away from banana body -->
  <path d="M20 22 Q14 16 10 20 Q10 26 16 28 Q18 26 20 22" fill="#E0BC18" />
  <!-- Brown stem tip at top -->
  <path d="M20 22 L18 18 L22 18 Z" fill="#7A5508" />
  <!-- Brown end at bottom -->
  <path d="M22 50 Q24 54 26 52 Q24 56 20 52 Z" fill="#7A5508" />

