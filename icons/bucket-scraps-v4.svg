  <path d="M53 22 Q46 10 44 4" stroke="#3D8B37" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M53 22 Q53 8 53 2" stroke="#4DA347" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M53 22 Q60 10 62 4" stroke="#3D8B37" stroke-width="2.2" fill="none" stroke-linecap="round" />

