<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">

  <!-- ============ HANDLE (behind everything) ============ -->
  <path d="M26 60 Q26 28 64 18 Q102 28 102 60" stroke="#888" stroke-width="5.5" fill="none" stroke-linecap="round" />
  <path d="M30 58 Q30 32 64 23 Q98 32 98 58" stroke="#AAA" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.35" />

  <!-- ============ BUCKET BODY (3/4 view) ============ -->
  <path d="M20 62 L28 112 Q30 124 64 124 Q98 124 100 112 L108 62 Z" fill="#A07820" />
  <!-- Left highlight -->
  <path d="M20 62 L28 112 Q30 124 44 124 L38 62 Z" fill="#B89030" opacity="0.35" />
  <!-- Right shadow -->
  <path d="M88 62 L100 112 Q98 124 82 124 L88 62 Z" fill="#7A5A10" opacity="0.3" />
  <!-- Metal bands -->
  <path d="M24 82 Q64 90 104 82" stroke="#8A6818" stroke-width="3" fill="none" opacity="0.35" />
  <path d="M26 100 Q64 108 102 100" stroke="#8A6818" stroke-width="3" fill="none" opacity="0.35" />

  <!-- ============ BUCKET RIM (thick elliptical band) ============ -->
  <!-- Outer rim -->
  <ellipse cx="64" cy="60" rx="46" ry="15" fill="#B89030" />
  <!-- Rim top highlight -->
  <ellipse cx="64" cy="57" rx="44" ry="12" fill="#CCA038" />
  <!-- Inner rim edge -->
  <ellipse cx="64" cy="60" rx="40" ry="12" fill="#806015" />

  <!-- ============ INTERIOR (dark base) ============ -->
  <ellipse cx="64" cy="61" rx="38" ry="11" fill="#3D2D10" />
  <!-- Greenish-brown compost base -->
  <ellipse cx="64" cy="61" rx="36" ry="10" fill="#4A5A28" opacity="0.8" />

  <!-- ============ BANANA PEEL (left side, laying flat inside) ============ -->
  <!-- Single long banana peel stretched across left side -->
  <path d="M24 52 Q22 48 24 44 Q26 40 30 40 Q38 42 42 46 Q46 52 46 58 Q46 64 42 68 Q38 70 34 70"
        fill="#F5D547" />
  <!-- Inner curve (darker yellow) -->
  <path d="M26 52 Q24 50 26 46 Q28 44 32 44 Q38 46 42 50 Q44 54 44 58 Q44 62 42 66 Q38 68 36 68"
        fill="#E8C420" opacity="0.5" />
  <!-- Brown spots on banana -->
  <ellipse cx="28" cy="48" rx="2" ry="1.5" fill="#7A5508" opacity="0.6" />
  <ellipse cx="36" cy="54" rx="2.5" ry="1.8" fill="#7A5508" opacity="0.5" />
  <ellipse cx="40" cy="62" rx="2" ry="1.5" fill="#7A5508" opacity="0.6" />
  <circle cx="32" cy="58" r="1.2" fill="#7A5508" opacity="0.7" />
  <!-- Brown ends -->
  <circle cx="24" cy="44" r="2" fill="#5D3A08" />
  <circle cx="34" cy="70" r="2" fill="#5D3A08" />

  <!-- ============ APPLE CORE (right side, viewed from above) ============ -->
  <!-- Core center (beige/cream with seed pockets) -->
  <ellipse cx="80" cy="58" rx="5" ry="6" fill="#E8DCC4" stroke="#C4B098" stroke-width="1.5" />
  <!-- Seed pockets/chambers -->
  <ellipse cx="78" cy="56" rx="1.5" ry="2" fill="#8B4513" opacity="0.6" />
  <ellipse cx="82" cy="56" rx="1.5" ry="2" fill="#8B4513" opacity="0.6" />
  <ellipse cx="78" cy="60" rx="1.5" ry="2" fill="#8B4513" opacity="0.6" />
  <ellipse cx="82" cy="60" rx="1.5" ry="2" fill="#8B4513" opacity="0.6" />
  <!-- Seeds (small dark spots) -->
  <ellipse cx="78" cy="57" rx="0.6" ry="1" fill="#3D2010" />
  <ellipse cx="82" cy="57" rx="0.6" ry="1" fill="#3D2010" />
  <!-- Remaining red flesh (eaten away) -->
  <path d="M74 58 Q73 54 76 52 Q78 51 80 52" fill="#E03030" />
  <path d="M86 58 Q87 54 84 52 Q82 51 80 52" fill="#E03030" />
  <path d="M74 58 Q73 62 76 64 Q78 65 80 64" fill="#DC2020" />
  <path d="M86 58 Q87 62 84 64 Q82 65 80 64" fill="#DC2020" />
  <!-- Browning on exposed core -->
  <ellipse cx="80" cy="58" rx="4" ry="5" fill="#A0826D" opacity="0.25" />
  <!-- Stem still attached -->
  <rect x="79" y="48" width="2" height="4" fill="#5D3A1A" rx="0.5" />
  <!-- Small leaf -->
  <ellipse cx="82" cy="50" rx="2.5" ry="1.5" fill="#3D8B37" transform="rotate(-20 82 50)" />

  <!-- ============ CARROT (center, angled) ============ -->
  <!-- Carrot body laying across -->
  <path d="M50 66 L44 56 Q46 52 50 52 Q54 52 54 56 Z" fill="#ED8722" />
  <!-- Carrot tip pointing into bucket -->
  <path d="M50 66 Q52 70 50 70 Q48 70 50 66" fill="#D07018" />
  <!-- Carrot highlight -->
  <path d="M50 66 L44 56 Q46 52 48 52 L48 66 Z" fill="#F5A040" opacity="0.3" />
  <!-- Carrot lines -->
  <line x1="46" y1="56" x2="52" y2="56" stroke="#C06818" stroke-width="0.8" opacity="0.5" />
  <line x1="47" y1="59" x2="52" y2="59" stroke="#C06818" stroke-width="0.8" opacity="0.5" />
  <line x1="48" y1="62" x2="51" y2="62" stroke="#C06818" stroke-width="0.8" opacity="0.5" />
  <!-- Greens stub -->
  <path d="M48 52 Q44 46 42 42" stroke="#3D8B37" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M50 52 Q50 44 50 40" stroke="#4DA347" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M52 52 Q56 46 58 42" stroke="#3D8B37" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- ============ EGGSHELL PIECES ============ -->
  <!-- Half shell -->
  <path d="M60 64 Q58 58 62 56 Q66 58 64 64 Z" fill="#F5F0E0" />
  <path d="M61 63 Q59.5 59 62.5 57.5" stroke="#D0C8A0" stroke-width="0.7" fill="none" />
  <!-- Small chip -->
  <path d="M56 62 L58 59 L60 62 Z" fill="#EDE5D0" />

  <!-- ============ COFFEE GROUNDS (scattered dark dots) ============ -->
  <circle cx="44" cy="62" r="1.2" fill="#2D1F15" />
  <circle cx="46" cy="60" r="1" fill="#3D2B1F" />
  <circle cx="68" cy="64" r="1.1" fill="#2D1F15" />
  <circle cx="72" cy="62" r="0.9" fill="#3D2B1F" />
  <circle cx="58" cy="66" r="1" fill="#2D1F15" />
  <circle cx="38" cy="64" r="0.8" fill="#3D2B1F" />

  <!-- ============ ONION SKIN (translucent) ============ -->
  <path d="M90 60 Q92 56 96 58 Q94 62 90 60 Z" fill="#C4943A" opacity="0.5" />

  <!-- ============ TEA BAG on rim ============ -->
  <line x1="96" y1="54" x2="102" y2="46" stroke="#8B7355" stroke-width="0.8" />
  <rect x="100" y="43" width="5" height="4" rx="0.5" fill="#C4A882" />

  <!-- Handle rivets (on top of rim) -->
  <circle cx="26" cy="60" r="3.5" fill="#999" />
  <circle cx="102" cy="60" r="3.5" fill="#999" />
  <circle cx="26" cy="60" r="1.5" fill="#777" />
  <circle cx="102" cy="60" r="1.5" fill="#777" />
</svg>
