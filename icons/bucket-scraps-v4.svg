  <!-- ============ BANANA PEEL (simplified - thick curved arc) ============ -->
  <!-- Banana = thick arc curving upward, like a smile rotated -->
  <!-- Main banana body - simple thick crescent -->
  <path d="M18 48 Q14 34 20 22 Q26 14 32 18 Q28 26 24 36 Q22 44 24 52"
        fill="#F5D547" stroke="#E8C420" stroke-width="1" />
  <!-- Lighter belly -->
