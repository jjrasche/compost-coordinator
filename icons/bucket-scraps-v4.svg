  <path d="M72 28 Q78 24 82 26 Q86 24 92 28 Q86 30 82 28 Q78 30 72 28 Z" fill="#C02020" />
  <path d="M66 42 Q64 34 68 28 Q72 26 76 28 Q70 32 70 42 Z" fill="#B82020" opacity="0.4" />
